

<ion-content>
  <main class="mobile-page">
    <label class="search-box">
      <span aria-hidden="true">⌕</span>
      <input
        type="search"
        [value]="searchTerm"
        (input)="onSearch($event)"
        placeholder="Buscar cancha..."
        aria-label="Buscar cancha"
      >
    </label>

    <section class="hero-card" aria-label="Reserva tu cancha">
      <img src="assets/canchas/cancha1.png" alt="Cancha disponible">
      <h1>Tu cancha en segundos</h1>
    </section>

    <nav class="filter-list" aria-label="Filtrar canchas">
      @for (filter of filtros; track filter) {
        <button
          type="button"
          class="filter-button"
          [class.is-active]="activeFilter === filter"
          (click)="setFilter(filter)"
        >
          <span>▣</span>{{ filter }}
        </button>
      }
    </nav>

    <section class="court-list" aria-label="Canchas disponibles">
      @for (c of filteredCanchas; track c.nombre) {
        <article class="court-card">
          <img class="court-image" [src]="c.imagen" [alt]="c.nombre">
          <div class="court-info">
            <h2>{{ c.nombre }}</h2>
            <p class="court-location"><span aria-hidden="true">●</span> {{ c.ubicacion }}</p>
            <ion-button class="court-button" expand="block" (click)="reservarCancha(c)">
              Reservar
            </ion-button>
          </div>
        </article>
      }
    </section>
  </main>
</ion-content>
